tasks:
  fmt:
    command: "true"
    options:
      cache: false
  lint:
    command: "true"
    options:
      cache: false
  test:
    command: "true"
    options:
      cache: false
  build:
    command: "true"
    options:
      cache: false
  lock-scope:
    script: "bash .moon/scripts/check-lock-scope.sh"
    options:
      cache: false
  check:
    deps: ["fmt", "lint", "test", "build", "lock-scope"]
